<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" width="560" height="660"><title>첫 실행 소개 — GPT 참고 시안</title><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="660" rx="12" fill="#151822" stroke="#151822"/><text x="280" y="42" fill="#edf0f6" font-size="24" font-weight="700" text-anchor="middle">Photoshop ↔ Aseprite</text><text x="280" y="70" fill="#b7bed0" font-size="15" font-weight="400" text-anchor="middle">레이어와 프레임을 손쉽게 주고받으세요.</text><rect x="20" y="94" width="520" height="224" rx="8" fill="#202432" stroke="#41465a"/><text x="36" y="120" fill="#edf0f6" font-size="17" font-weight="700" text-anchor="start">Photoshop 레이어를 Aseprite 프레임으로</text><text x="36" y="145" fill="#71c9ff" font-size="13" font-weight="600" text-anchor="start">Photoshop</text><text x="326" y="145" fill="#edf0f6" font-size="13" font-weight="600" text-anchor="start">Aseprite</text><rect x="36" y="156" width="166" height="22" rx="3" fill="#514368" stroke="#c5b6ff"/><rect x="43" y="160" width="14" height="14" rx="1" fill="#e0e0e2" stroke="#e0e0e2"/><text x="64" y="171" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">그림 1</text><rect x="36" y="181" width="166" height="22" rx="3" fill="#34394a" stroke="#41465a"/><rect x="43" y="185" width="14" height="14" rx="1" fill="#b8a2e9" stroke="#b8a2e9"/><text x="64" y="196" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">그림 2</text><rect x="36" y="206" width="166" height="22" rx="3" fill="#34394a" stroke="#41465a"/><rect x="43" y="210" width="14" height="14" rx="1" fill="#e5bb83" stroke="#e5bb83"/><text x="64" y="221" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">그림 3</text><path d="M238 192h48m-8 -7 8 7 -8 7" stroke="#c5b6ff" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="326" y="155" width="170" height="82" rx="4" fill="#303645" stroke="#41465a"/><text x="396" y="171" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">1</text><rect x="381" y="180" width="29" height="25" rx="2" fill="#e0e0e2" stroke="#e0e0e2"/><text x="428" y="171" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">2</text><rect x="413" y="180" width="29" height="25" rx="2" fill="#b8a2e9" stroke="#b8a2e9"/><text x="460" y="171" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">3</text><rect x="445" y="180" width="29" height="25" rx="2" fill="#e5bb83" stroke="#e5bb83"/><text x="334" y="198" fill="#edf0f6" font-size="10" font-weight="400" text-anchor="start">Layer</text><text x="411" y="225" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">연속 프레임</text><text x="36" y="266" fill="#b7bed0" font-size="13" font-weight="400" text-anchor="start">레이어 선택 → 레이어 → 프레임 모드 → 복사</text><text x="36" y="288" fill="#b7bed0" font-size="13" font-weight="400" text-anchor="start">Aseprite 대상 문서에서 F4 → 연속 프레임에 배치</text><rect x="20" y="330" width="520" height="101" rx="8" fill="#202432" stroke="#41465a"/><text x="36" y="354" fill="#edf0f6" font-size="16" font-weight="700" text-anchor="start">반대 방향도 간단합니다</text><text x="36" y="382" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="start">Aseprite 셀 선택</text><path d="M178 378h48m-8 -7 8 7 -8 7" stroke="#c5b6ff" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="240" y="362" width="54" height="30" rx="4" fill="#7146bd" stroke="#7146bd"/><text x="267" y="382" fill="#edf0f6" font-size="14" font-weight="700" text-anchor="middle">F5</text><path d="M306 378h48m-8 -7 8 7 -8 7" stroke="#c5b6ff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="365" y="382" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">Photoshop 붙여넣기</text><text x="36" y="412" fill="#b7bed0" font-size="13" font-weight="400" text-anchor="start">복사한 리소스를 반전·회전하거나 정렬할 수도 있어요.</text><rect x="20" y="443" width="520" height="112" rx="8" fill="#202432" stroke="#41465a"/><text x="36" y="467" fill="#edf0f6" font-size="17" font-weight="700" text-anchor="start">처음 사용하시나요?</text><text x="36" y="491" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">연결된 프로그램과 스크립트 상태를 확인하고</text><text x="36" y="512" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">필요한 설정부터 복사·붙여넣기까지 함께 안내해 드립니다.</text><text x="36" y="537" fill="#b7bed0" font-size="12" font-weight="400" text-anchor="start">이미 설정을 마쳤다면 바로 작업을 시작할 수 있습니다.</text><rect x="20" y="570" width="520" height="39" rx="6" fill="#7146bd" stroke="#7146bd"/><text x="280" y="595" fill="#edf0f6" font-size="14" font-weight="600" text-anchor="middle">초기 설정 함께 시작하기</text><rect x="20" y="614" width="520" height="39" rx="6" fill="#202432" stroke="#565e75"/><text x="280" y="639" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="middle">이미 설정했어요 / 바로 작업하기</text><text x="280" y="650" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">GPT 참고 시안 · 실제 호스트 화면 아님</text></g></svg>