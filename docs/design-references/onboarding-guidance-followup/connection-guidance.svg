<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 472" width="560" height="472"><title>Photoshop 연결 안내 — GPT 참고 시안</title><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="472" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="34" fill="#edf0f6" font-size="20" font-weight="700" text-anchor="start">Photoshop 연결 · 1/4</text><text x="20" y="66" fill="#edf0f6" font-size="18" font-weight="600" text-anchor="start">먼저 사용할 Photoshop을 확인해 볼게요.</text><text x="20" y="92" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">자동으로 찾은 버전과 설치 경로를 아래에서 확인하세요.</text><rect x="20" y="112" width="520" height="145" rx="8" fill="#202432" stroke="#41465a"/><rect x="35" y="128" width="44" height="44" rx="7" fill="#062e48" stroke="none"/><text x="57" y="157" fill="#31a8ff" font-size="24" font-weight="700" text-anchor="middle">Ps</text><text x="94" y="145" fill="#edf0f6" font-size="20" font-weight="700" text-anchor="start">Adobe Photoshop 2027</text><text x="94" y="169" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">버전 28.0 · 종료됨</text><text x="36" y="201" fill="#b7bed0" font-size="13" font-weight="600" text-anchor="start">설치 경로</text><text x="36" y="225" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="start">C:\Program Files\Adobe\…\Photoshop.exe</text><text x="36" y="244" fill="#b7bed0" font-size="12" font-weight="400" text-anchor="start">버전과 경로를 확인할 때는 실행하지 않아도 됩니다.</text><rect x="20" y="271" width="520" height="39" rx="6" fill="#202432" stroke="#565e75"/><text x="280" y="296" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="middle">다른 버전 또는 경로 선택</text><rect x="20" y="324" width="520" height="60" rx="7" fill="#262c39" stroke="#41465a"/><text x="36" y="346" fill="#edf0f6" font-size="16" font-weight="700" text-anchor="start">이 버전이 맞나요?</text><text x="36" y="368" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">맞다면 다음을 눌러 실행 경고 설정을 확인해 볼게요.</text><rect x="20" y="398" width="132" height="39" rx="6" fill="#202432" stroke="#565e75"/><text x="86" y="423" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="middle">나중에 설정</text><rect x="358" y="398" width="182" height="39" rx="6" fill="#7146bd" stroke="#7146bd"/><text x="449" y="423" fill="#edf0f6" font-size="14" font-weight="600" text-anchor="middle">이 버전으로 계속</text><text x="280" y="462" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">GPT 참고 시안 · 실제 호스트 화면 아님</text></g></svg>