<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650"><title>스크립트 실행 도움말 — GPT 참고 시안</title><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="650" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="34" fill="#edf0f6" font-size="20" font-weight="700" text-anchor="start">Aseprite 스크립트 실행 도움말</text><text x="20" y="62" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">F5가 작동하지 않나요? 메뉴에서 직접 실행해 볼 수 있어요.</text><rect x="20" y="80" width="520" height="217" rx="8" fill="#202432" stroke="#41465a"/><text x="36" y="105" fill="#edf0f6" font-size="15" font-weight="600" text-anchor="start">1. Aseprite에서 연습 문서를 열고 셀을 선택하세요.</text><rect x="36" y="119" width="488" height="163" rx="5" fill="#474750" stroke="#6f6f79"/><rect x="43" y="126" width="474" height="23" rx="2" fill="#66666e" stroke="none"/><rect x="47" y="128" width="45" height="19" rx="2" fill="#8c73b4" stroke="#c5b6ff"/><text x="69" y="142" fill="#edf0f6" font-size="12" font-weight="700" text-anchor="middle">File</text><text x="106" y="142" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">Edit   Sprite   Layer</text><rect x="48" y="150" width="151" height="115" rx="3" fill="#34343b" stroke="#b3b0bd"/><text x="59" y="171" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">Open…</text><text x="59" y="192" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">Save</text><rect x="52" y="207" width="141" height="23" rx="2" fill="#7146bd" stroke="#c5b6ff"/><text x="61" y="223" fill="#edf0f6" font-size="12" font-weight="600" text-anchor="start">Scripts  ›</text><rect x="196" y="207" width="158" height="54" rx="3" fill="#34343b" stroke="#b3b0bd"/><rect x="200" y="211" width="150" height="21" rx="2" fill="#7146bd" stroke="#c5b6ff"/><text x="208" y="226" fill="#edf0f6" font-size="12" font-weight="600" text-anchor="start">aseprite_copy</text><text x="208" y="248" fill="#edf0f6" font-size="12" font-weight="400" text-anchor="start">aseprite_paste</text><text x="367" y="186" fill="#c5b6ff" font-size="12" font-weight="600" text-anchor="start">File → Scripts</text><text x="367" y="205" fill="#c5b6ff" font-size="12" font-weight="400" text-anchor="start">→ 복사 스크립트</text><text x="20" y="319" fill="#b7bed0" font-size="13" font-weight="400" text-anchor="start">F4 연습 중에는 준비된 빈 대상에서 aseprite_paste를 선택하세요.</text><rect x="20" y="336" width="520" height="211" rx="8" fill="#202432" stroke="#41465a"/><text x="36" y="361" fill="#edf0f6" font-size="16" font-weight="700" text-anchor="start">2. 파일 접근 승인 창이 나타난다면</text><rect x="36" y="375" width="488" height="99" rx="5" fill="#39343e" stroke="#806b92"/><text x="280" y="401" fill="#edf0f6" font-size="16" font-weight="600" text-anchor="middle">파일 읽기·쓰기 권한 확인 창</text><text x="280" y="425" fill="#c5b6ff" font-size="13" font-weight="600" text-anchor="middle">이 영역은 실제 Aseprite 승인창 캡처로 교체</text><text x="280" y="448" fill="#b7bed0" font-size="12" font-weight="400" text-anchor="middle">승인 대상과 허용 버튼을 실제 화면에서 강조</text><text x="36" y="497" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">설치한 스크립트인지 확인하고 직접 허용하세요.</text><text x="36" y="518" fill="#b7bed0" font-size="14" font-weight="400" text-anchor="start">이미 승인했다면 창이 나타나지 않을 수 있습니다.</text><rect x="20" y="560" width="520" height="40" rx="6" fill="#262c39" stroke="#41465a"/><text x="36" y="585" fill="#edf0f6" font-size="14" font-weight="400" text-anchor="start">승인 후 연습 화면으로 돌아가 결과를 확인하세요.</text><rect x="20" y="608" width="520" height="39" rx="6" fill="#7146bd" stroke="#7146bd"/><text x="280" y="633" fill="#edf0f6" font-size="14" font-weight="600" text-anchor="middle">연습으로 돌아가기</text><text x="280" y="640" fill="#b7bed0" font-size="11" font-weight="400" text-anchor="middle">GPT 참고 시안 · 실제 호스트 화면 아님</text></g></svg>