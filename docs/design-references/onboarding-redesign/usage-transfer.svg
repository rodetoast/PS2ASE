<svg xmlns="http://www.w3.org/2000/svg" width="560" height="465" viewBox="0 0 560 465"><title>양방향 전송 사용 방법 — 개념 시안</title><defs><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#787986"/><path d="M0 0H6V6H0ZM6 6H12V12H6Z" fill="#a1a3af"/></pattern><g id="pixel"><path d="M8 4H32V10H38V28H32V34H8V28H2V10H8Z" fill="#bda0eb"/><path d="M12 15H18V21H12ZM24 15H30V21H24Z" fill="#47355f"/></g><g id="arrow"><path d="M0 0H31m-7 -6 7 6 -7 6" fill="none" stroke="#c5b6ff" stroke-width="2"/></g></defs><g font-family="Pretendard, Malgun Gothic, sans-serif" fill="#edf0f6"><rect width="560" height="465" rx="12" fill="#151822"/><text x="20" y="32" font-size="21" font-weight="700">프로그램 사용 방법 · 기본 전송</text><rect x="20" y="48" width="520" height="187" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="74" font-size="17" font-weight="700">Photoshop → Aseprite</text><rect x="36" y="86" width="178" height="104" rx="6" fill="#333747" stroke="#62687c"/><text x="48" y="104" font-size="12" fill="#b7bed0">Photoshop · 레이어</text><rect x="47" y="114" width="156" height="27" rx="3" fill="#68558c" stroke="#c5b6ff"/><rect x="53" y="120" width="15" height="15" fill="#bda0eb"/><text x="76" y="132" font-size="12">연습 그림 · 선택</text><rect x="47" y="148" width="156" height="24" rx="3" fill="#484e5d"/><text x="76" y="164" font-size="12">보조 레이어</text><use href="#arrow" x="224" y="138"/><rect x="267" y="107" width="72" height="62" rx="8" fill="#7146bd"/><text x="303" y="133" text-anchor="middle" font-size="15" font-weight="700">복사</text><text x="303" y="151" text-anchor="middle" font-size="11">도구</text><use href="#arrow" x="349" y="138"/><rect x="389" y="86" width="135" height="104" rx="6" fill="#333747" stroke="#62687c"/><text x="456" y="104" text-anchor="middle" font-size="12">Aseprite · F4</text><rect x="432" y="112" width="48" height="48" fill="url(#grid)"/><use href="#pixel" x="436" y="119"/><text x="280" y="218" text-anchor="middle" font-size="13" fill="#b7bed0">레이어 선택 → 도구에서 복사 → 대상 Aseprite에서 F4</text><rect x="20" y="247" width="520" height="187" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="273" font-size="17" font-weight="700">Aseprite → Photoshop</text><rect x="36" y="285" width="178" height="104" rx="6" fill="#333747" stroke="#62687c"/><text x="48" y="303" font-size="12" fill="#b7bed0">Aseprite · 타임라인</text><rect x="47" y="318" width="75" height="22" rx="2" fill="#68558c"/><text x="53" y="333" font-size="11">Character</text><rect x="126" y="318" width="23" height="22" rx="2" fill="#997bd3" stroke="#ead9ff" stroke-width="2"/><circle cx="137" cy="329" r="3" fill="#eee5ff"/><rect x="153" y="318" width="23" height="22" fill="#555b6b" stroke="#777e91"/><rect x="180" y="318" width="23" height="22" fill="#555b6b" stroke="#777e91"/><text x="47" y="367" font-size="12" fill="#c5b6ff">그림이 있는 셀 선택</text><use href="#arrow" x="224" y="337"/><rect x="267" y="306" width="72" height="62" rx="8" fill="#7146bd"/><text x="303" y="332" text-anchor="middle" font-size="16" font-weight="700">F5</text><text x="303" y="350" text-anchor="middle" font-size="11">복사</text><use href="#arrow" x="349" y="337"/><rect x="389" y="285" width="135" height="104" rx="6" fill="#333747" stroke="#62687c"/><text x="456" y="303" text-anchor="middle" font-size="12">Photoshop</text><rect x="432" y="311" width="48" height="48" fill="url(#grid)"/><use href="#pixel" x="436" y="318"/><text x="456" y="378" text-anchor="middle" font-size="11" fill="#c5b6ff">도구에서 붙여넣기</text><text x="280" y="417" text-anchor="middle" font-size="13" fill="#b7bed0">셀 선택 → Aseprite에서 F5 → 도구에서 Photoshop 붙여넣기</text><text x="280" y="454" text-anchor="middle" font-size="11" fill="#b7bed0">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>