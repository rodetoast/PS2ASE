<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img"><title>정렬 기준 기억하기 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="170" rx="12" fill="#151822" stroke="#151822"/><rect x="20" y="16" width="520" height="120" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="43" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">정렬 기준</text><rect x="294" y="27" width="17" height="17" rx="3" fill="#7146bd" stroke="#c5b6ff"/><text x="302.5" y="40" font-size="13" fill="#edf0f6" font-weight="700" text-anchor="middle">✓</text><text x="320" y="41" font-size="13" fill="#edf0f6" font-weight="400" text-anchor="start">선택한 정렬 기억하기</text><rect x="36" y="57" width="157" height="36" rx="7" fill="#44345e" stroke="#a58ae3"/><text x="114" y="80" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">바닥선 기준</text><rect x="201" y="57" width="157" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="279.5" y="80" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">중앙 기준</text><rect x="366" y="57" width="158" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="445" y="80" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">원본 좌표</text><text x="36" y="116" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">다음 실행 시 기억한 정렬 기준을 사용합니다.</text><text x="280" y="158" font-size="11" fill="#b7bed0" font-weight="400" text-anchor="middle">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>