<svg xmlns="http://www.w3.org/2000/svg" width="560" height="630" viewBox="0 0 560 630" role="img"><title>초기 설정 시작 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="630" rx="12" fill="#151822" stroke="#151822"/><text x="280" y="48" font-size="25" fill="#edf0f6" font-weight="700" text-anchor="middle">Photoshop ↔ Aseprite</text><text x="280" y="77" font-size="15" fill="#b7bed0" font-weight="400" text-anchor="middle">두 프로그램 사이에서 리소스를 손쉽게 주고받으세요.</text><rect x="24" y="110" width="200" height="206" rx="12" fill="#333747" stroke="#646d83"/><rect x="36" y="123" width="176" height="37" rx="6" fill="#063448" stroke="none"/><text x="124" y="147" font-size="18" fill="#c9e7f6" font-weight="600" text-anchor="middle">Ps  Photoshop</text><rect x="68" y="176" width="112" height="112" rx="0" fill="url(#grid)" stroke="none"/><g transform="translate(91 197) scale(1.05)"><path d="M16 8H48V16H56V40H48V48H16V40H8V16H16Z" fill="#bda0eb"/><path d="M20 23H28V31H20ZM36 23H44V31H36Z" fill="#47355f"/></g><rect x="336" y="110" width="200" height="206" rx="12" fill="#3e3f4b" stroke="#646d83"/><rect x="348" y="123" width="176" height="37" rx="6" fill="#666775" stroke="none"/><text x="436" y="147" font-size="18" fill="#edf0f6" font-weight="600" text-anchor="middle">Aseprite</text><rect x="390" y="169" width="92" height="92" rx="0" fill="url(#grid)" stroke="none"/><g transform="translate(404 188) scale(0.95)"><path d="M16 8H48V16H56V40H48V48H16V40H8V16H16Z" fill="#bda0eb"/><path d="M20 23H28V31H20ZM36 23H44V31H36Z" fill="#47355f"/></g><rect x="365" y="272" width="44" height="25" rx="1" fill="#71618d" stroke="#a58ac5"/><circle cx="387" cy="284" r="5" fill="#d9c6ef"/><rect x="413" y="272" width="44" he