<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img"><title>F5 복사 연습 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="640" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="35" font-size="21" fill="#edf0f6" font-weight="700" text-anchor="start">F5 복사 연습</text><text x="540" y="35" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="end">연습 1 / 2</text><rect x="20" y="50" width="520" height="368" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="77" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">1. Aseprite에서 연습 문서를 열고 셀 선택</text><rect x="36" y="91" width="488" height="252" rx="7" fill="#333641" stroke="#555d73"/><rect x="43" y="98" width="474" height="22" rx="3" fill="#494d5b" stroke="none"/><text x="54" y="113" font-size="12" fill="#edf0f6" font-weight="400" text-anchor="start">Aseprite · 복사 연습</text><rect x="226" y="130" width="108" height="108" rx="0" fill="url(#grid)" stroke="none"/><g transform="translate(249 151) scale(1)"><path d="M16 8H48V16H56V40H48V48H16V40H8V16H16Z" fill="#bda0eb"/><path d="M20 23H28V31H20ZM36 23H44V31H36Z" fill="#47355f"/></g><rect x="49" y="250" width="462" height="70" rx="5" fill="#363a47" stroke="#62687c"/><text x="192" y="265" font-size="10" fill="#b7bed0" font-weight="400" text-anchor="middle">1</text><text x="230" y="265" font-size="10" fill="#b7bed0" font-weight="400" text-anchor="middle">2</text><text x="268" y="265" font-size="10" fill="#b7bed0" font-weight="400" text-anchor="middle">3</text><rect x="55" y="270" width="114" height="20" rx="2" fill="#484e5d" stroke="none"/><text x="62" y="284" font-size="11" fill="#edf0f6" font-weight="400" text-anchor="start">Effect</text><rect x="174" y="270" width="35" height="20" rx="2" fill="#555b6b" stroke="#777e91"/><rect x="212" y="270" width="35" height="20" rx="2" fill="#555b6b" stroke="#777e91"/><circle cx="229" cy="280" r="3.5" fill="#e0d8ed"/><rect x="250" y="270" width="35" height="20" rx="2" fill="#555b6b" stroke="#777e91"/><rect x="55" y="292" width="114" height="20" rx="2" fill="#68558c" stroke="none"/><text x="62" y="306" font-size="11" fill="#edf0f6" font-weight="400" text-anchor="start">Character</text><rect x="174" y="292" width="35" height="20" rx="2" fill="#997bd3" stroke="#ead9ff"/><circle cx="191" cy="302" r="3.5" fill="#e0d8ed"/><rect x="212" y="292" width="35" height="20" rx="2" fill="#555b6b" stroke="#777e91"/><circle cx="229" cy="302" r="3.5" fill="#e0d8ed"/><rect x="250" y="292" width="35" height="20" rx="2" fill="#555b6b" stroke="#777e91"/><circle cx="267" cy="302" r="3.5" fill="#e0d8ed"/><path d="M340 291L211 302m8 -8 -8 8 10 4" stroke="#e6bf88" stroke-width="2" fill="none"/><text x="345" y="289" font-size="12" fill="#e6bf88" font-weight="600" text-anchor="start">그림이 있는 셀</text><rect x="36" y="355" width="488" height="36" rx="7" fill="#7146bd" stroke="#7146bd"/><text x="280" y="378" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">Aseprite 연습 문서 열기</text><text x="36" y="406" font-size="12" fill="#b7bed0" font-weight="400" text-anchor="start">개념도: 실제 타임라인의 해당 셀을 선택하세요.</text><rect x="20" y="430" width="520" height="132" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="455" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">2. Aseprite 창에서 F5 누르기</text><rect x="36" y="467" width="38" height="27" rx="5" fill="#35394a" stroke="#35394a"/><text x="55" y="485" font-size="14" fill="#edf0f6" font-weight="700" text-anchor="middle">F5</text><text x="88" y="486" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">복사 결과를 기다리는 중…</text><text x="36" y="518" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">처음에는 스크립트 승인창이 나타날 수 있습니다.</text><text x="36" y="538" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">성공하면 F4 붙여넣기 연습으로 이동합니다.</text><text x="20" y="599" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">테스트 취소</text><rect x="368" y="578" width="172" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="454" y="601" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">F4 연습으로 (성공 후)</text><text x="280" y="628" font-size="11" fill="#b7bed0" font-weight="400" text-anchor="middle">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>