<svg xmlns="http://www.w3.org/2000/svg" width="560" height="515" viewBox="0 0 560 515" role="img"><title>Aseprite 승인 및 연습 시작 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="515" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="36" font-size="21" fill="#edf0f6" font-weight="700" text-anchor="start">3. Aseprite 설정 및 사용 준비</text><rect x="20" y="52" width="520" height="111" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="76" font-size="18" fill="#edf0f6" font-weight="700" text-anchor="start">Aseprite</text><circle cx="45" cy="103" r="8" fill="none" stroke="#99d5b8" stroke-width="1.5"/><path d="M41 103l3 3 5 -6" fill="none" stroke="#99d5b8" stroke-width="1.5"/><text x="62" y="108" font-size="15" fill="#edf0f6" font-weight="400" text-anchor="start">스크립트 설치</text><text x="522" y="108" font-size="14" fill="#99d5b8" font-weight="400" text-anchor="end">완료</text><circle cx="45" cy="136" r="8" fill="none" stroke="#99d5b8" stroke-width="1.5"/><path d="M41 136l3 3 5 -6" fill="none" stroke="#99d5b8" stroke-width="1.5"/><text x="62" y="141" font-size="15" fill="#edf0f6" font-weight="400" text-anchor="start">F4 / F5 단축키 등록</text><text x="522" y="141" font-size="14" fill="#99d5b8" font-weight="400" text-anchor="end">완료</text><rect x="20" y="175" width="520" height="196" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="199" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">이제 복사·붙여넣기를 연습합니다</text><text x="36" y="223" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">Aseprite에서 연습 문서를 열고 그림이 있는 셀을 선택하세요.</text><text x="36" y="245" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">F5와 F4를 처음 실행할 때 권한 요청이 나타날 수 있습니다.</text><text x="36" y="267" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">설치한 스크립트인지 확인한 후 직접 허용하세요.</text><text x="36" y="289" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">이미 승인했다면 권한 요청이 나타나지 않을 수 있습니다.</text><rect x="36" y="307" width="488" height="36" rx="7" fill="#7146bd" stroke="#7146bd"/><text x="280" y="330" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">복사·붙여넣기 연습 시작</text><rect x="20" y="384" width="520" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="280" y="407" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">스크립트 실행 승인 방법 자세히 보기</text><text x="20" y="445" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">나중에 설정</text><rect x="368" y="425" width="80" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="408" y="448" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">이전</text><rect x="456" y="425" width="84" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="498" y="448" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">다음</text><text x="280" y="503" font-size="11" fill="#b7bed0" font-weight="400" text-anchor="middle">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>