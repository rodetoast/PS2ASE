<svg xmlns="http://www.w3.org/2000/svg" width="560" height="693" viewBox="0 0 560 693" role="img"><title>F4 붙여넣기 연습 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="693" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="35" font-size="21" fill="#edf0f6" font-weight="700" text-anchor="start">F4 붙여넣기 연습</text><text x="540" y="35" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="end">연습 2 / 2</text><rect x="20" y="50" width="520" height="227" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="75" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">1. Photoshop 복사본 준비</text><rect x="36" y="87" width="488" height="94" rx="5" fill="#333747" stroke="#555d73"/><rect x="49" y="99" width="68" height="68" rx="0" fill="url(#grid)" stroke="none"/><g transform="translate(59 111) scale(0.75)"><path d="M16 8H48V16H56V40H48V48H16V40H8V16H16Z" fill="#bda0eb"/><path d="M20 23H28V31H20ZM36 23H44V31H36Z" fill="#47355f"/></g><rect x="143" y="102" width="363" height="26" rx="3" fill="#53506b" stroke="#c5b6ff"/><text x="155" y="120" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="start">▣  연습 그림 레이어 — 선택</text><text x="143" y="151" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">Photoshop에서 연습 PNG 탭과 픽셀 레이어를 선택</text><rect x="36" y="190" width="488" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="280" y="213" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">Photoshop 연습 문서 열기</text><rect x="36" y="231" width="488" height="36" rx="7" fill="#7146bd" stroke="#7146bd"/><text x="280" y="254" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">연습 그림 복사</text><rect x="20" y="289" width="520" height="215" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="314" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">2. 빈 Aseprite 연습 문서에서 F4</text><rect x="36" y="328" width="90" height="90" rx="0" fill="url(#grid)" stroke="none"/><path d="M145 374h48m-8 -6 8 6 -8 6" fill="none" stroke="#c5b6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="328" width="90" height="90" rx="0" fill="url(#grid)" stroke="none"/><g transform="translate(230 345) scale(0.9)"><path d="M16 8H48V16H56V40H48V48H16V40H8V16H16Z" fill="#bda0eb"/><path d="M20 23H28V31H20ZM36 23H44V31H36Z" fill="#47355f"/></g><text x="337" y="356" font-size="15" fill="#edf0f6" font-weight="600" text-anchor="start">빈 문서 → 그림</text><rect x="337" y="370" width="38" height="27" rx="5" fill="#35394a" stroke="#35394a"/><text x="356" y="388" font-size="14" fill="#edf0f6" font-weight="700" text-anchor="middle">F4</text><text x="36" y="438" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">연습 문서의 첫 프레임과 대상 레이어를 선택하세요.</text><rect x="36" y="454" width="488" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="280" y="477" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">빈 Aseprite 연습 문서 열기</text><rect x="20" y="516" width="520" height="112" rx="10" fill="#202432" stroke="#41465a"/><text x="36" y="541" font-size="17" fill="#edf0f6" font-weight="700" text-anchor="start">3. 붙여넣기 결과 확인</text><text x="36" y="564" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">자동 결과가 도착하지 않으면 실제 그림을 보고 확인하세요.</text><rect x="36" y="577" width="488" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="280" y="600" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">그림이 보입니다 · 직접 확인</text><text x="20" y="660" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">테스트 취소</text><rect x="372" y="639" width="168" height="36" rx="7" fill="#7146bd" stroke="#7146bd"/><text x="456" y="662" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">테스트 마치고 다음</text><text x="280" y="681" font-size="11" fill="#b7bed0" font-weight="400" text-anchor="middle">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>