<svg xmlns="http://www.w3.org/2000/svg" width="560" height="566" viewBox="0 0 560 566" role="img"><title>Photoshop 실행 경고 — design reference, not actual implementation</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#777986"/><path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#a0a2af"/></pattern></defs><g font-family="Pretendard, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="560" height="566" rx="12" fill="#151822" stroke="#151822"/><text x="20" y="36" font-size="21" fill="#edf0f6" font-weight="700" text-anchor="start">2. Photoshop 실행 경고</text><rect x="20" y="52" width="520" height="220" rx="10" fill="#202432" stroke="#41465a"/><rect x="36" y="68" width="44" height="44" rx="8" fill="#062e48" stroke="none"/><text x="58" y="97" font-size="23" fill="#31a8ff" font-weight="700" text-anchor="middle">Ps</text><text x="94" y="86" font-size="21" fill="#edf0f6" font-weight="700" text-anchor="start">Adobe Photoshop 2027</text><text x="94" y="108" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">버전 28.0</text><text x="522" y="108" font-size="13" fill="#99d5b8" font-weight="400" text-anchor="end">● 실행 중</text><path d="M36 124h488" stroke="#41465a"/><text x="36" y="148" font-size="16" fill="#edf0f6" font-weight="600" text-anchor="start">저장된 실행 경고 설정</text><text x="522" y="148" font-size="16" fill="#edf0f6" font-weight="600" text-anchor="end">꺼짐</text><rect x="36" y="160" width="238" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="155" y="183" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">경고 켜기</text><rect x="282" y="160" width="240" height="36" rx="7" fill="#44345e" stroke="#a58ae3"/><text x="402" y="183" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">✓ 경고 끄기</text><text x="36" y="218" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">저장된 설정을 확인했습니다.</text><text x="36" y="239" font-size="13" fill="#b7bed0" font-weight="400" text-anchor="start">실제 승인창은 이후 Photoshop 복사 연습에서 직접 확인할 수 있습니다.</text><text x="20" y="300" font-size="15" fill="#edf0f6" font-weight="700" text-anchor="start">경고 켜기 · 권장</text><text x="20" y="321" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">외부 스크립트를 직접 승인합니다. Photoshop에서 복사하거나</text><text x="20" y="343" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">Photoshop으로 붙여넣을 때마다 승인창이 나타날 수 있습니다.</text><text x="20" y="375" font-size="15" fill="#edf0f6" font-weight="700" text-anchor="start">경고 끄기</text><text x="20" y="396" font-size="14" fill="#b7bed0" font-weight="400" text-anchor="start">반복 승인을 줄입니다. 선택한 버전의 모든 외부 JSX에 적용됩니다.</text><rect x="20" y="416" width="520" height="61" rx="7" fill="#30271f" stroke="#70583c"/><text x="32" y="437" font-size="14" fill="#e6bf88" font-weight="700" text-anchor="start">변경 전 확인</text><text x="32" y="459" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="start">작업 저장 → Photoshop 종료 → 동의·백업 → 재시작</text><rect x="20" y="490" width="160" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="100" y="513" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">상태 다시 확인</text><rect x="368" y="490" width="80" height="36" rx="7" fill="#202432" stroke="#545b72"/><text x="408" y="513" font-size="14" fill="#edf0f6" font-weight="400" text-anchor="middle">이전</text><rect x="456" y="490" width="84" height="36" rx="7" fill="#7146bd" stroke="#7146bd"/><text x="498" y="513" font-size="14" fill="#edf0f6" font-weight="600" text-anchor="middle">다음</text><text x="280" y="554" font-size="11" fill="#b7bed0" font-weight="400" text-anchor="middle">GPT 디자인 참고 시안 · 실제 구현 화면 아님</text></g></svg>